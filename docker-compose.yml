services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      FLASK_DEBUG: "false"
    restart: unless-stopped